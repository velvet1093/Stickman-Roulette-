<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a2238">
  <title>Sakura Hearts</title>
  <style>
/* Sakura Hearts — fullscreen layout. The canvas fills the screen; HUD,
   controls, dialogue and menus float over it. --scene-* vars are set by
   game.js to the area where background scenes are drawn. */
:root {
  --bg: #2a2238;
  --panel: #362c48;
  --panel-2: #43375a;
  --line: #5b4c78;
  --text: #f6eefc;
  --muted: #b9a9d0;
  --accent: #ff7aa2;
  --accent-2: #ffd36b;
  --good: #7ee0a0;
  --bad: #ff8a8a;
  --glass: rgba(30, 22, 44, .72);
  --font: 'DotGothic16', ui-monospace, 'Courier New', monospace;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}

[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  overscroll-behavior: none;
  overflow: hidden;
}
button { font-family: inherit; color: inherit; }

#app { position: fixed; inset: 0; overflow: hidden; background: #1a1424; }
#scene {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  display: block;
  touch-action: none;
}

/* ---------------------------------------------------------------- HUD */
#hud {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 5;
  padding: calc(6px + var(--safe-t)) calc(12px + var(--safe-r)) 6px calc(12px + var(--safe-l));
  background: linear-gradient(var(--glass), rgba(30, 22, 44, .55));
  border-bottom: 2px solid rgba(91, 76, 120, .7);
  font-size: 14px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  pointer-events: none;
}
#hud button { pointer-events: auto; }
.hud-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.hud-right { display: flex; align-items: center; gap: 10px; }
#hud-day { color: var(--accent-2); }
#hud-money { color: var(--good); }
#hud-stats { display: flex; gap: 10px; color: var(--muted); }
#hud-stats b { color: var(--text); font-weight: normal; }
#hud-needs { justify-content: flex-start; gap: 8px; flex-wrap: wrap; }
.need { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; }
.need .bar { width: 30px; height: 5px; background: #2a2238; border: 1px solid #5b4c78; display: inline-block; }
.need .bar span { display: block; height: 100%; background: var(--good); }
.need.mid .bar span { background: #f2c94c; }
.need.low .bar span { background: #e05a5a; }
.need.low { animation: pulse 1s infinite alternate; }
@keyframes pulse { to { opacity: .45; } }
.needbars { display: flex; gap: 10px; flex-wrap: wrap; }
.energy { display: flex; align-items: center; gap: 6px; }
.energy .bar { width: 80px; height: 8px; background: #241c30; border: 1px solid var(--line); display: inline-block; }
.energy .bar span { display: block; height: 100%; background: var(--accent-2); transition: width .3s; }
.icon-btn { background: var(--panel-2); border: 2px solid var(--line); font-size: 14px; line-height: 1; padding: 3px 6px; cursor: pointer; }
@media (min-width: 720px) {
  #hud { flex-direction: row; justify-content: space-between; align-items: center; }
  #hud .hud-row:first-child { order: 2; }
}

/* ------------------------------------------------------- title & toasts */
#title-logo {
  position: absolute;
  top: calc(var(--scene-top, 0px) + var(--scene-h, 300px) * .07);
  left: var(--scene-left, 0px);
  width: var(--scene-w, 100%);
  text-align: center;
  pointer-events: none;
  z-index: 2;
}
#title-logo .logo {
  font-size: clamp(30px, calc(var(--scene-w, 400px) * .13), 72px);
  color: #fff;
  text-shadow: 3px 3px 0 #d8467a, -2px -2px 0 #6a3a8a, 0 0 18px rgba(255, 140, 190, .6);
  letter-spacing: 2px;
}
#title-logo .sub { font-size: clamp(13px, 3.4vw, 20px); color: #ffe6f0; text-shadow: 2px 2px 0 #6a3a8a; margin-top: 4px; }

#toast {
  position: absolute;
  top: calc(var(--hud-h, 60px) + 52px);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  pointer-events: none;
  width: min(92%, 520px);
  z-index: 8;
}
.toast-item {
  background: rgba(30, 20, 44, .94);
  border: 2px solid var(--line);
  padding: 4px 10px;
  font-size: 14px;
  animation: toast 2.6s forwards;
  text-align: center;
}
.toast-item.good { border-color: var(--accent); color: #ffd6e4; }
.toast-item.bad { border-color: #6a7ad8; color: #c8d0ff; }
.toast-item.info { border-color: var(--accent-2); color: #fff1c8; }
@keyframes toast {
  0% { opacity: 0; transform: translateY(-6px); }
  10%, 80% { opacity: 1; transform: none; }
  100% { opacity: 0; }
}

#daycard {
  position: absolute;
  inset: 0;
  z-index: 9;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(20, 14, 30, .9);
  font-size: 32px;
  color: var(--accent-2);
  animation: fadeinout 1.6s forwards;
  pointer-events: none;
}
#daycard small { font-size: 16px; color: var(--muted); margin-top: 6px; }
@keyframes fadeinout { 0% { opacity: 0; } 20%, 75% { opacity: 1; } 100% { opacity: 0; } }

/* ------------------------------------------------ town controls overlay */
#world-ui { position: absolute; inset: 0; z-index: 3; user-select: none; -webkit-user-select: none; }
#touch-layer { position: absolute; inset: 0; touch-action: none; cursor: grab; }
#prompt {
  position: absolute;
  top: calc(var(--hud-h, 60px) + 8px);
  left: 50%;
  transform: translateX(-50%);
  max-width: calc(100% - 24px);
  background: var(--glass);
  border: 2px solid rgba(91, 76, 120, .8);
  padding: 5px 12px;
  font-size: 15px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
}
#prompt .key { display: inline-block; background: var(--accent); color: #2a1828; padding: 0 6px; margin-right: 8px; }
#prompt .where { color: var(--accent-2); }

#joy {
  position: absolute;
  width: 128px; height: 128px;
  margin: -64px 0 0 -64px;
  left: calc(84px + var(--safe-l));
  top: calc(100% - 96px - var(--safe-b));
  border-radius: 50%;
  background: rgba(30, 22, 44, .35);
  border: 3px solid rgba(255, 255, 255, .28);
  pointer-events: none;
  transition: opacity .15s;
  opacity: .75;
}
#joy.active { opacity: 1; transition: none; }
#knob {
  position: absolute;
  left: 50%; top: 50%;
  width: 56px; height: 56px;
  margin: -28px 0 0 -28px;
  border-radius: 50%;
  background: rgba(255, 122, 162, .85);
  border: 3px solid #ffc6d8;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .3);
}
#joy-hint {
  position: absolute;
  left: calc(20px + var(--safe-l));
  bottom: calc(14px + var(--safe-b));
  width: 128px;
  text-align: center;
  font-size: 11px;
  color: rgba(255, 255, 255, .75);
  text-shadow: 1px 1px 0 #000;
  pointer-events: none;
}
.side {
  position: absolute;
  right: calc(16px + var(--safe-r));
  bottom: calc(20px + var(--safe-b));
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 12px;
}
.mini { display: flex; gap: 8px; }
.act-row { display: flex; align-items: flex-end; gap: 10px; }
.runbtn { width: 60px; height: 60px; margin-bottom: 4px; border-radius: 50%; background: var(--glass); border: 3px solid rgba(255, 255, 255, .45); color: #fff; font-family: inherit; font-size: 15px; cursor: pointer; box-shadow: 0 3px 0 rgba(0, 0, 0, .35); }
.runbtn.on { background: #5ab8f0; border-color: #d0f0ff; color: #12304a; box-shadow: 0 3px 0 #2a6a9a; }
.runbtn:active { transform: translateY(2px); }
.round {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: var(--glass);
  border: 2px solid rgba(255, 255, 255, .35);
  font-size: 20px;
  cursor: pointer;
}
.round:active { transform: translateY(2px); }
.abtn {
  width: 88px; height: 88px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid #ffc6d8;
  box-shadow: 0 4px 0 #a8406a;
  color: #2a1828;
  font-size: 34px;
  cursor: pointer;
}
.abtn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #a8406a; }
.abtn:disabled { background: rgba(90, 74, 108, .7); border-color: rgba(255, 255, 255, .3); box-shadow: 0 4px 0 rgba(0, 0, 0, .3); color: rgba(255, 255, 255, .5); }

/* ---------------------------------------------- dialogue & menu panel */
#panel {
  position: absolute;
  z-index: 4;
  top: var(--panel-top, 50%);
  left: var(--panel-left, 0px);
  right: 0;
  bottom: 0;
  overflow-y: auto;
  padding: 14px max(12px, var(--safe-r)) calc(16px + var(--safe-b)) max(12px, var(--safe-l));
  display: flex;
  flex-direction: column;
  gap: 8px;
}
#panel > * { width: 100%; max-width: 760px; margin-inline: auto; }

#relbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 13px;
  color: var(--muted);
}
#relbar .hearts { letter-spacing: 1px; color: var(--accent); font-size: 14px; }
#relbar .hearts .off { color: #5a4a6c; }

#dialog {
  position: relative;
  background: var(--panel);
  border: 2px solid var(--line);
  box-shadow: inset 0 0 0 2px #2a2238, 0 3px 0 #1a1424;
  padding: 10px 12px 18px;
  min-height: 84px;
  cursor: pointer;
  user-select: none;
  margin-top: 6px;
}
#speaker {
  position: absolute;
  top: -13px;
  left: 10px;
  background: var(--panel-2);
  border: 2px solid var(--line);
  padding: 1px 8px;
  font-size: 13px;
}
#speaker:empty { display: none; }
#text { font-size: 16px; line-height: 1.5; min-height: 48px; padding-top: 4px; }
#text.narration { color: var(--muted); font-style: italic; }
#next {
  position: absolute;
  right: 10px;
  bottom: 2px;
  font-size: 12px;
  color: var(--accent);
  animation: bob .8s infinite alternate;
  visibility: hidden;
}
#next.show { visibility: visible; }
@keyframes bob { to { transform: translateY(3px); } }

#menu { display: flex; flex-direction: column; gap: 6px; }
.loc-title { font-size: 18px; color: var(--accent-2); }
.loc-desc { font-size: 13px; color: var(--muted); margin-top: -4px; }
.section { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

.btn {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  text-align: left;
  background: var(--panel-2);
  border: 2px solid var(--line);
  box-shadow: 0 3px 0 #1e1828;
  padding: 9px 12px;
  font-size: 15px;
  cursor: pointer;
  transition: transform .05s, background .1s;
}
.btn:hover:not(:disabled) { background: #51426c; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #1e1828; }
.btn.btn:disabled { cursor: not-allowed; border-color: var(--line); background: #2f2740; color: #8a7aa0; box-shadow: 0 3px 0 #1e1828; }
.btn:disabled .note, .btn:disabled .ico { opacity: .7; }
.btn:focus-visible, .round:focus-visible, .abtn:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.btn .ico { width: 1.4em; text-align: center; flex: none; }
.btn .lbl { flex: 1; }
.btn .note { font-size: 12px; color: var(--muted); }
.btn.girl { border-color: var(--gc, var(--accent)); }
.btn.primary { background: #6a3a6a; border-color: var(--accent); }
.btn.choice { background: var(--panel); border-color: var(--accent); }
.btn.choice:hover { background: #4a3658; }

.row { display: flex; gap: 6px; }
.row .btn { justify-content: center; text-align: center; padding: 9px 6px; }
.row .btn .lbl { flex: none; }

/* -------------------------------------------------------------- modal */
#modal {
  position: fixed;
  inset: 0;
  background: rgba(10, 6, 18, .7);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 20;
}
.sheet {
  width: 100%;
  max-width: 820px;
  max-height: calc(92dvh - var(--safe-t));
  background: var(--panel);
  border: 2px solid var(--line);
  border-bottom: none;
  display: flex;
  flex-direction: column;
  animation: up .18s ease-out;
}
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.sheet-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 2px solid var(--line);
  font-size: 18px;
  color: var(--accent-2);
}
#modal-close { background: none; border: none; font-size: 20px; cursor: pointer; }
#modal-body { overflow-y: auto; padding: 12px 14px calc(20px + var(--safe-b)); display: flex; flex-direction: column; gap: 8px; }

.tabs { display: flex; gap: 6px; flex: none; }
.tabs .btn { justify-content: center; padding: 6px 1px; font-size: 14px; flex: 1 1 0; min-width: 0; }
.tabs .btn:nth-last-child(n+5), .tabs .btn:nth-last-child(n+5) ~ .btn { font-size: 12px; }
.tabs .btn .lbl { overflow: hidden; text-overflow: ellipsis; }
.tabs .btn.on { background: #6a3a6a; border-color: var(--accent); }

.card { display: flex; gap: 10px; background: var(--panel-2); border: 2px solid var(--line); padding: 8px; }
.card canvas { image-rendering: pixelated; flex: none; align-self: flex-start; width: 64px; height: 64px; background: #3b3349; border: 2px solid #2a2238; }
.card .info { flex: 1; min-width: 0; font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
.card .name { font-size: 16px; }
.card .stage { color: var(--accent-2); }
.card .hearts { color: var(--accent); letter-spacing: 1px; }
.card .hearts .off { color: #5a4a6c; }
.card .muted { color: var(--muted); }
.tag { display: inline-block; padding: 0 5px; margin: 1px 2px 1px 0; border: 1px solid var(--line); font-size: 12px; }
.tag.loved { border-color: var(--accent); color: #ffc6d8; }
.tag.liked { border-color: var(--good); color: #c8f4d8; }
.tag.disliked { border-color: #6a7ad8; color: #c8d0ff; }

.statline { display: flex; justify-content: space-between; font-size: 15px; padding: 4px 0; border-bottom: 1px dashed var(--line); }

input.name {
  width: 100%;
  font-family: inherit;
  font-size: 18px;
  padding: 10px;
  background: #241c30;
  color: var(--text);
  border: 2px solid var(--line);
  outline: none;
}
input.name:focus { border-color: var(--accent); }

.ending { text-align: center; display: flex; flex-direction: column; gap: 10px; font-size: 15px; line-height: 1.6; }
.ending h2 { margin: 0; color: var(--accent); font-weight: normal; font-size: 24px; }
.help p { margin: 0 0 8px; font-size: 14px; line-height: 1.5; }
.help b { color: var(--accent-2); font-weight: normal; }

/* -------------------------------------------------------- save slots */
.slot-card { display: flex; flex-direction: column; gap: 6px; background: var(--panel-2); border: 2px solid var(--line); padding: 10px; }
.slot-card.current { border-color: var(--good); }
.slot-head { display: flex; align-items: center; gap: 8px; font-size: 16px; }
.slot-head b { color: var(--accent-2); font-weight: normal; }
.slot-time { margin-left: auto; font-size: 12px; color: var(--muted); }
.slot-info { font-size: 13px; color: var(--text); }
.slot-info .muted, .muted { color: var(--muted); }
.save-status { font-size: 14px; line-height: 1.5; background: var(--panel-2); border: 2px solid var(--line); padding: 8px 10px; }
.save-status b { color: var(--good); font-weight: normal; }
.save-status span { color: var(--muted); font-size: 12px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; }
}

/* ---------------------------------------------------------- wardrobe */
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; flex: none; }
.chip { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 6px; background: var(--panel-2); border: 2px solid var(--line); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; }
.chip canvas { image-rendering: pixelated; width: 32px; height: 32px; }
.chip.on { border-color: var(--accent); background: #6a3a6a; }
.wardrobe-preview { image-rendering: pixelated; width: 392px; max-width: 100%; align-self: center; background: #3b3349; border: 2px solid #2a2238; }
.wrow { display: flex; flex-direction: column; gap: 4px; }
.wlabel { font-size: 14px; color: var(--accent-2); }
.wopts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { padding: 6px 10px; background: var(--panel-2); border: 2px solid var(--line); color: var(--text); font-family: inherit; font-size: 13px; cursor: pointer; }
.pill.on { border-color: var(--accent); background: #6a3a6a; }
.swatch { width: 28px; height: 28px; border: 2px solid var(--line); cursor: pointer; padding: 0; }
.swatch.on { border-color: #ffd36b; box-shadow: 0 0 0 2px #ffd36b; }

/* --------------------------------------------------------- minigames */
.mg-area { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.mg-canvas { image-rendering: pixelated; width: 320px; max-width: 100%; aspect-ratio: 160 / 200; align-self: center; background: #1a1424; border: 2px solid var(--line); touch-action: none; }
.mg-ctl { display: flex; gap: 6px; }
.mg-ctl .btn { flex: 1 1 0; justify-content: center; }
.mg-result { text-align: center; display: flex; flex-direction: column; gap: 4px; font-size: 15px; padding: 8px; background: var(--panel-2); border: 2px solid var(--line); }
.mg-result .big { font-size: 34px; color: #ffd36b; }
.mg-result .win { color: var(--good); font-size: 18px; }
.mg-result .lose { color: #ff8a8a; font-size: 18px; }
.mg-status { text-align: center; font-size: 14px; line-height: 1.5; min-height: 3em; }
.mg-reels { display: flex; justify-content: center; gap: 8px; padding: 12px; background: linear-gradient(#3a1e4a, #22142e); border: 3px solid #ffd36b; }
.mg-reel { width: 64px; height: 72px; display: flex; align-items: center; justify-content: center; font-size: 38px; background: #fff7ea; border: 2px solid #2a2238; filter: blur(1px); }
.mg-reel.stopped { filter: none; }
.mg-table { display: flex; flex-direction: column; gap: 10px; padding: 12px; background: radial-gradient(#2f7a4a, #1b4a2e); border: 3px solid #7a4a28; border-radius: 40px / 24px; }
.mg-hand { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 58px; }
.mg-hand .who { width: 100%; font-size: 13px; color: #e8ffe8; }
.mg-card { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 52px; background: #fffdf6; color: #1a1424; border: 2px solid #2a2238; border-radius: 4px; font-size: 17px; box-shadow: 2px 2px 0 rgba(0,0,0,.35); }
.mg-card.red { color: #d0304a; }
.mg-card.back { background: repeating-linear-gradient(45deg, #b0306a 0 4px, #8a2050 4px 8px); color: #ffd6e8; }
.btn.on { border-color: var(--accent); background: #6a3a6a; }

/* ------------------------------------------------- WhatsUp chat app */
.wa { display: flex; flex-direction: column; background: #0f1c1a; border: 2px solid #1f3a34; min-height: 360px; }
.wa-bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #1f4a40; color: #e8fff6; font-size: 15px; }
.wa-bar > span { margin-left: auto; font-size: 12px; color: #a8d8c8; }
.wa-back { background: none; border: none; color: #e8fff6; font-size: 26px; line-height: 1; cursor: pointer; padding: 0 4px; font-family: inherit; }
.wa-av { width: 38px; height: 38px; flex: none; border-radius: 50%; image-rendering: pixelated; background: #3b3349; }
.wa-icon { display: flex; align-items: center; justify-content: center; font-size: 20px; }
.wa-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: none; border: none; border-bottom: 1px solid #1f3a34; color: var(--text); font-family: inherit; text-align: left; cursor: pointer; }
.wa-row:hover { background: #16302a; }
.wa-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.wa-mid b { font-weight: normal; font-size: 15px; }
.wa-mid span { font-size: 12px; color: #a8c8bc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wa-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 11px; color: #a8c8bc; }
.wa-badge { min-width: 18px; padding: 0 5px; border-radius: 9px; background: #25d366; color: #0f1c1a; text-align: center; font-size: 12px; }
.wa-badge.pin { background: #ffd36b; }

  <script>
// Tiny pixel-art raster: every shape is filled per-pixel (no anti-aliasing),
// so sprites stay crisp when scaled up with image smoothing disabled.
(function (global) {
  'use strict';

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function rgbToHex(r, g, b) {
    const c = (v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0');
    return '#' + c(r) + c(g) + c(b);
  }

  // Darken a color, nudging it toward a warm purple so outlines feel hand-picked
  // instead of flat black (matches the soft-outline chibi style).
  function shade(hex, amt) {
    const [r, g, b] = hexToRgb(hex);
    const k = 1 - amt;
    return rgbToHex(r * k + 20 * amt, g * k + 8 * amt, b * k + 28 * amt);
  }

  function tint(hex, amt) {
    const [r, g, b] = hexToRgb(hex);
    return rgbToHex(r + (255 - r) * amt, g + (255 - g) * amt, b + (255 - b) * amt);
  }

  function mix(a, b, t) {
    const A = hexToRgb(a), B = hexToRgb(b);
    return rgbToHex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t);
  }

  class Buf {
    constructor(w, h) {
      this.w = w;
      this.h = h;
      this.d = new Array(w * h).fill(null);
      this.clip = false; // when true, only already-filled pixels can be painted
    }

    set(x, y, c) {
      x = Math.floor(x); y = Math.floor(y);
      if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
      const i = y * this.w + x;
      if (this.clip && this.d[i] === null) return;
      this.d[i] = c;
    }

    get(x, y) {
      if (x < 0 || y < 0 || x >= this.w || y >= this.h) return null;
      return this.d[y * this.w + x];
    }

    rect(x, y, w, h, c) {
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, c);
      return this;
    }

    ellipse(cx, cy, rx, ry, c) {
      for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
        for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
          const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
          if (dx * dx + dy * dy <= 1) this.set(x, y, c);
        }
      }
      return this;
    }

    poly(pts, c) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const [x, y] of pts) {
        minX = Math.min(minX, x); minY = Math.min(minY, y);
        maxX = Math.max(maxX, x); maxY = Math.max(maxY, y);
      }
      for (let y = Math.floor(minY); y <= Math.ceil(maxY); y++) {
        for (let x = Math.floor(minX); x <= Math.ceil(maxX); x++) {
          const px = x + 0.5, py = y + 0.5;
          let inside = false;
          for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
            const [xi, yi] = pts[i], [xj, yj] = pts[j];
            if ((yi > py) !== (yj > py) && px < ((xj - xi) * (py - yi)) / (yj - yi) + xi) inside = !inside;
          }
          if (inside) this.set(x, y, c);
        }
      }
      return this;
    }

    line(x0, y0, x1, y1, c) {
      x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
      const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
      let err = dx + dy;
      for (;;) {
        this.set(x0, y0, c);
        if (x0 === x1 && y0 === y1) break;
        const e2 = 2 * err;
        if (e2 >= dy) { err += dy; x0 += sx; }
        if (e2 <= dx) { err += dx; y0 += sy; }
      }
      return this;
    }

    // Stamp a hand-authored map. '.' or ' ' are transparent.
    map(x, y, rows, pal, flip) {
      rows.forEach((row, j) => {
        for (let i = 0; i < row.length; i++) {
          const ch = row[i];
          if (ch === '.' || ch === ' ') continue;
          const c = pal[ch];
          if (c) this.set(flip ? x + row.length - 1 - i : x + i, y + j, c);
        }
      });
      return this;
    }

    // Mirror the left half onto the right half (for symmetric bodies).
    mirrorX() {
      const half = Math.floor(this.w / 2);
      for (let y = 0; y < this.h; y++) {
        for (let x = 0; x < half; x++) {
          const v = this.d[y * this.w + x];
          if (v !== null) this.d[y * this.w + (this.w - 1 - x)] = v;
        }
      }
      return this;
    }

    // Wrap the filled shape in a 1px outline made from a darker version of
    // the neighbouring color.
    outline(amt = 0.55, color = null) {
      const out = this.clone();
      for (let y = 0; y < this.h; y++) {
        for (let x = 0; x < this.w; x++) {
          if (this.get(x, y) !== null) continue;
          const n = this.get(x, y - 1) || this.get(x, y + 1) || this.get(x - 1, y) || this.get(x + 1, y);
          if (n) out.d[y * this.w + x] = color || shade(n, amt);
        }
      }
      this.d = out.d;
      return this;
    }

    // Darken pixels that border empty space on the given side (cheap rim shading).
    rimShade(dx, dy, amt) {
      const src = this.d.slice();
      for (let y = 0; y < this.h; y++) {
        for (let x = 0; x < this.w; x++) {
          const v = src[y * this.w + x];
          if (v === null) continue;
          const nx = x + dx, ny = y + dy;
          const n = nx < 0 || ny < 0 || nx >= this.w || ny >= this.h ? null : src[ny * this.w + nx];
          if (n === null) this.d[y * this.w + x] = shade(v, amt);
        }
      }
      return this;
    }

    draw(other, ox = 0, oy = 0) {
      for (let y = 0; y < other.h; y++) {
        for (let x = 0; x < other.w; x++) {
          const v = other.d[y * other.w + x];
          if (v !== null) this.set(x + ox, y + oy, v);
        }
      }
      return this;
    }

    clone() {
      const b = new Buf(this.w, this.h);
      b.d = this.d.slice();
      return b;
    }

    toCanvas(scale = 1) {
      const cv = document.createElement('canvas');
      cv.width = this.w * scale;
      cv.height = this.h * scale;
      const ctx = cv.getContext('2d');
      for (let y = 0; y < this.h; y++) {
        for (let x = 0; x < this.w; x++) {
          const v = this.d[y * this.w + x];
          if (v === null) continue;
          ctx.fillStyle = v;
          ctx.fillRect(x * scale, y * scale, scale, scale);
        }
      }
      return cv;
    }
  }

  global.PX = { Buf, shade, tint, mix, hexToRgb, rgbToHex };
})(window);

</script>
  <script>
// Hand-designed 16x16 pixel icons that replace emoji everywhere in the UI.
// Each icon is drawn in code like the rest of the art (no image files), then
// any emoji in the page's text is swapped for its icon as it appears.
//   ICONS.img(emoji) -> <img> or null · ICONS.list() -> [emoji]
(function (global) {
  'use strict';
  const { Buf, shade, tint } = PX;
  const S = 16;
  const INK = '#2a1828';

  // ---------------------------------------------------------- palette
  const C = {
    red: '#e0404a', redD: '#a82838', pink: '#ff8ab0', pinkL: '#ffc6d8', rose: '#f05a8a', orange: '#f59a3a', yellow: '#f8d04a', yellowL: '#fff0a0', gold: '#e0b040',
    green: '#5ac46a', greenD: '#2f8a4a', leaf: '#7ad07a', teal: '#3ab8b0', sky: '#8ed0f4', blue: '#3b78e0', blueD: '#2a4a9a', navy: '#2a3060', purple: '#9a5ae0', lilac: '#c8b0f0',
    brown: '#9a6a3a', brownD: '#6a4426', tan: '#e0b884', cream: '#fff4dc', white: '#ffffff', grey: '#a8a4b4', greyD: '#5a5664', black: '#2a2632', skin: '#fde3cc', face: '#ffd24a',
  };

  // ---------------------------------------------------------- helpers
  function mk(draw, opts = {}) {
    return () => {
      const b = new Buf(S, S);

      return b;
    };
  }
  const heartShape = (b, c, x = 0, y = 0, hi = true) => {
    b.map(1 + x, 2 + y, ['.xxx..xxx.', 'xxxxxxxxxx', 'xxxxxxxxxx', 'xxxxxxxxxx', '.xxxxxxxx.', '..xxxxxx..', '...xxxx...', '....xx....'].map((r) => r + '..'), { x: c });
    b.rect(x + 1, y + 2, 12, 0, c);
    if (hi) { b.set(x + 3, y + 3, tint(c, 0.6)); b.set(x + 2, y + 4, tint(c, 0.4)); }
  };
  const bigHeart = (b, c) => {
    b.map(1, 2, ['..xxx..xxx...', '.xxxxxxxxxxx.', 'xxxxxxxxxxxxx', 'xxxxxxxxxxxxx', 'xxxxxxxxxxxxx', '.xxxxxxxxxxx.', '..xxxxxxxxx..', '...xxxxxxx...', '....xxxxx....', '.....xxx.....', '......x......'], { x: c });
    b.set(3, 4, tint(c, 0.65)); b.set(4, 3, tint(c, 0.65)); b.set(3, 5, tint(c, 0.35));
  };

  function face(o = {}) {
    return mk((b) => {
      b.ellipse(8, 8, 7, 7, o.base || C.face);
      b.ellipse(8, 9.5, 5.5, 4.5, o.base || C.face);
      b.set(4, 4, C.yellowL); b.set(5, 3, C.yellowL);
      const ink = INK;
      const eyes = o.eyes || 'dot';
      if (eyes === 'dot') { b.rect(5, 6, 1, 2, ink); b.rect(10, 6, 1, 2, ink); }
      else if (eyes === 'happy') { b.set(4, 7, ink); b.set(5, 6, ink); b.set(6, 7, ink); b.set(9, 7, ink); b.set(10, 6, ink); b.set(11, 7, ink); }
      else if (eyes === 'closed') { b.rect(4, 7, 3, 1, ink); b.rect(9, 7, 3, 1, ink); }
      else if (eyes === 'hearts') { for (const x of [3, 9]) { b.map(x, 5, ['x.x', 'xxx', '.x.'].map((r) => r), { x: C.red }); b.set(x + 1, 5, C.red); } b.map(3, 5, ['x.x.', 'xxxx'], { x: C.red }); }
      else if (eyes === 'wink') { b.rect(5, 6, 1, 2, ink); b.set(9, 7, ink); b.set(10, 6, ink); b.set(11, 7, ink); }
      else if (eyes === 'smug') { b.rect(4, 7, 3, 1, ink); b.rect(9, 7, 3, 1, ink); b.set(6, 6, ink); b.set(11, 6, ink); }
      else if (eyes === 'x') { b.set(4, 6, ink); b.set(6, 6, ink); b.set(5, 7, ink); b.set(4, 8, ink); b.set(6, 8, ink); b.set(9, 6, ink); b.set(11, 6, ink); b.set(10, 7, ink); b.set(9, 8, ink); b.set(11, 8, ink); }
      else if (eyes === 'wide') { b.rect(4, 5, 2, 3, C.white); b.rect(10, 5, 2, 3, C.white); b.set(5, 6, ink); b.set(10, 6, ink); }
      else if (eyes === 'shades') { b.rect(3, 6, 4, 2, C.black); b.rect(9, 6, 4, 2, C.black); b.rect(7, 6, 2, 1, C.black); b.set(4, 6, C.greyD); b.set(10, 6, C.greyD); }
      else if (eyes === 'angry') { b.set(4, 5, ink); b.set(5, 6, ink); b.set(11, 5, ink); b.set(10, 6, ink); b.rect(5, 7, 1, 1, ink); b.rect(10, 7, 1, 1, ink); }
      else if (eyes === 'sad') { b.set(4, 6, ink); b.set(5, 5, ink); b.set(11, 6, ink); b.set(10, 5, ink); b.rect(5, 7, 1, 1, ink); b.rect(10, 7, 1, 1, ink); }
      const m = o.mouth || 'smile';
      if (m === 'smile') { b.set(5, 10, ink); b.rect(6, 11, 4, 1, ink); b.set(10, 10, ink); }
      else if (m === 'grin') { b.rect(5, 10, 6, 1, ink); b.rect(5, 11, 6, 1, C.white); b.rect(6, 12, 4, 1, ink); }
      else if (m === 'open') { b.rect(6, 10, 4, 3, C.redD); b.rect(7, 12, 2, 1, C.pink); }
      else if (m === 'flat') b.rect(6, 11, 4, 1, ink);
      else if (m === 'frown') { b.rect(6, 10, 4, 1, ink); b.set(5, 11, ink); b.set(10, 11, ink); }
      else if (m === 'o') b.rect(7, 10, 2, 2, C.redD);
      else if (m === 'smirk') { b.rect(7, 11, 3, 1, ink); b.set(10, 10, ink); }
      else if (m === 'kiss') { b.set(8, 10, ink); b.set(9, 11, ink); b.set(8, 12, ink); }
      else if (m === 'wail') { b.rect(5, 10, 6, 3, C.redD); b.rect(6, 10, 4, 1, C.white); }
      else if (m === 'mask') { b.rect(3, 9, 10, 4, C.white); b.rect(3, 10, 10, 1, '#dde8f0'); }
      if (o.blush) { b.rect(3, 9, 2, 1, C.pink); b.rect(11, 9, 2, 1, C.pink); }
      if (o.tears) { b.rect(4, 8, 1, 6, C.sky); b.rect(11, 8, 1, 6, C.sky); }
      if (o.tear) b.rect(12, 8, 1, 3, C.sky);
      if (o.heart) { b.map(11, 9, ['x.x', 'xxx', '.x.'], { x: C.red }); }
      if (o.horns) { b.poly([[2, 3], [3, 0], [5, 2]], C.purple); b.poly([[11, 2], [13, 0], [14, 3]], C.purple); }
      if (o.puff) { b.rect(12, 9, 3, 2, C.white); b.rect(13, 8, 2, 1, C.white); }
      if (o.sweat) b.rect(12, 3, 2, 3, C.sky);
      if (o.zzz) { b.map(10, 0, ['xxxx', '..x.', '.x..', 'xxxx'], { x: C.blue }); }
    });
  }
  const building = (roof, wall, opts = {}) => mk((b) => {
    b.poly([[1, 7], [8, 1], [15, 7]], roof);
    b.rect(2, 7, 12, 8, wall);
    b.rect(2, 7, 12, 1, shade(wall, 0.15));
    b.rect(7, 10, 3, 5, opts.door || C.brown);
    if (opts.window !== false) { b.rect(3, 9, 3, 2, C.sky); b.rect(11, 9, 2, 2, C.sky); }
    if (opts.extra) opts.extra(b);
  });
  const glass = (liquid, opts = {}) => mk((b) => {
    b.poly([[3, 3], [13, 3], [11, 14], [5, 14]], C.white);
    b.poly([[4, 6], [12, 6], [10.6, 13], [5.4, 13]], liquid);
    b.rect(5, 7, 1, 4, tint(liquid, 0.5));
    if (opts.straw) { b.line(10, 0, 8, 8, C.red); b.line(11, 0, 9, 8, C.red); }
    if (opts.umbrella) { b.poly([[9, 3], [12, 0], [15, 3]], C.pink); b.line(12, 3, 11, 7, C.brown); }
  });
  const fruit = (c, opts = {}) => mk((b) => {
    b.ellipse(8, 9, opts.rx || 6, opts.ry || 6, c);
    b.set(5, 6, tint(c, 0.6)); b.set(6, 5, tint(c, 0.6)); b.set(5, 7, tint(c, 0.35));
    b.rect(8, 1, 1, 3, C.brownD);
    b.poly([[9, 2], [13, 1], [12, 4], [9, 4]], C.leaf);
    if (opts.dots) for (const [x, y] of [[6, 9], [9, 8], [11, 11], [7, 12], [10, 13], [4, 11]]) b.set(x, y, opts.dots);
  });
  const book = (c, opts = {}) => mk((b) => {
    b.rect(3, 1, 10, 14, c);
    b.rect(3, 1, 2, 14, shade(c, 0.25));
    b.rect(12, 2, 1, 12, C.cream);
    b.rect(6, 4, 5, 2, tint(c, 0.55));
    if (opts.open) { b.rect(1, 3, 14, 11, C.cream); b.rect(7, 3, 2, 11, shade(C.cream, 0.15)); for (let y = 5; y < 13; y += 2) { b.rect(2, y, 4, 1, C.grey); b.rect(10, y, 4, 1, C.grey); } }

    if (d.band && !d.headTowel) b.rect(side ? 5 : 3, 2, side ? 8 : 10, 1, d.band);
    if (d.bats) { b.rect(2, 2, 2, 2, '#1e1a24'); b.set(1, 1, '#1e1a24'); b.rect(12, 2, 2, 2, '#1e1a24'); b.set(14, 1, '#1e1a24'); }
    if (d.choker && !up && !side) b.rect(6, 13, 4, 1, '#1e1a24');
    if (d.nightcap) { b.rect(3, 0, 10, 3, d.nightcap); b.rect(2, 3, 12, 1, PX.tint(d.nightcap, 0.45)); b.rect(12, 1, 2, 2, d.nightcap); b.set(14, 3, d.nightcap); b.set(15, 4, '#ffffff'); b.set(14, 4, '#ffffff'); }
    if (d.headTowel) { b.rect(5, 0, 6, 2, d.headTowel); b.set(5, 0, PX.tint(d.headTowel, 0.5)); }
    if (d.horns) { b.set(4, 0, d.horns); b.set(5, 1, d.horns); b.set(11, 0, d.horns); b.set(10, 1, d.horns); }
    if (d.ears && !up) {
      if (side) { b.set(12, 8, SKIN); b.set(13, 7, SKIN); }
      else { b.set(0, 8, SKIN); b.set(1, 8, SKIN); b.set(15, 8, SKIN); b.set(14, 8, SKIN); b.set(0, 7, SKIN); b.set(15, 7, SKIN); }
    }
    if (d.ahoge) { b.set(8, 0, hb); b.set(9, 0, hb); b.set(7, 1, hb); b.set(8, 1, hb); }
    if (d.loop) { b.ellipse(8, 1, 2.2, 1.6, hb); b.set(8, 1, null); b.rect(7, 2, 3, 1, '#3a6fd0'); }
    if (d.accent && !up) b.rect(side ? 10 : 11, 2, 2, 2, d.accent);
    if (d.accent && up) b.rect(10, 2, 2, 2, d.accent);
    if (d.ribbon) {
      if (up) { b.rect(7, 2, 3, 2, d.ribbon); b.set(6, 1, d.ribbon); b.set(10, 1, d.ribbon); }
      else { b.rect(13, 2, 2, 2, d.ribbon); b.set(15, 1, d.ribbon); }
    }

    // face
    if (!up) {
      const lash = '#2a1828';
      if (side) {
        b.rect(3, 8, 3, 1, lash); b.rect(3, 9, 2, 2, d.eye); b.set(3, 9, '#ffffff');
        b.set(4, 12, '#d08a8a');
      } else {
        b.rect(4, 8, 3, 1, lash); b.rect(9, 8, 3, 1, lash); b.set(4, 9, lash); b.set(11, 9, lash);
        b.rect(5, 9, 2, 2, d.eye); b.rect(9, 9, 2, 2, d.eye);
        b.set(5, 9, '#ffffff'); b.set(10, 9, '#ffffff');
        b.set(7, 12, '#d08a8a'); b.set(8, 12, '#d08a8a');
      }
    }

    if (d.hideEye && !up && !side) {
      // a lock of bangs sweeping down over one eye, joined to the fringe
      if (d.hideEye === 'left') {
        b.poly([[2, 5], [8, 5], [8, 8], [7, 11], [5, 12], [3, 11], [2, 8]], hb);
        b.line(4, 6, 5, 11, hd); b.line(7, 6, 6, 9, hl);
      } else {
        b.poly([[8, 5], [14, 5], [14, 8], [13, 11], [11, 12], [9, 11], [8, 8]], hb);
        b.line(12, 6, 11, 11, hd); b.line(9, 6, 10, 9, hl);

    }
    b.outline(0.55);
    if (flip) {
      const out = new Buf(W, H);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) out.d[y * W + (W - 1 - x)] = b.d[y * W + x];
      return out;
    }

  }

  // Sprite left/right are drawn facing left, so 'left' is the base.
  const cache = new Map();
  function get(id, dir = 'down', frame = 0, outfit = null, o = null) {
    const k = id + dir + frame + (outfit || '') + (o ? JSON.stringify(o) : '');
    if (!cache.has(k)) cache.set(k, build(id, dir, frame, outfit, o || {}).toCanvas(1));
    return cache.get(k);
  }

  global.WALKERS = { get, W, H, DEFS };
})(window);

  <script>
// The open-world town of Sakuragaoka: a 76x40 tile map (16px tiles) with

    const x = (i * 37 + 11) % MW, y = (i * 23 + 5) % MH;

  }

  // -------------------------------------------------------------- buildings
  // door is the column of the door on the building's bottom row; the

  const B = {

    onsen: { short: 'Onsen', name: 'Sakura Onsen', x: 49, y: 3, w: 7, h: 6, door: 52, style: 'onsen', enter: true },
    clocktower: { short: 'Clock', name: 'Clock Tower', x: 59, y: 1, w: 5, h: 8, door: 61, style: 'clocktower', enter: true },

    // the east district

  };
  for (const [id, b] of Object.entries(B)) {
    b.id = id;
    b.mat = { x: b.door, y: b.y + b.h };
    fill(b.door, b.y + b.h, 1, 1, tiles[b.y + b.h][b.door] === '.' || tiles[b.y + b.h][b.door] === ',' ? ':' : tiles[b.y + b.h][b.door]);
  }
  // little paths from doors to the roads
  fill(6, 9, 1, 1, ':'); fill(39, 9, 1, 1, ':');
  for (const id of ['home', 'cafe', 'mall', 'arcade', 'maidcafe', 'bakery', 'antiques']) fill(B[id].door, 18, 1, 2, ':');
  fill(5, 29, 1, 2, ':'); fill(51, 29, 1, 2, ':'); fill(41, 29, 1, 2, ':');
  fill(81, 18, 1, 2, ':'); fill(81, 29, 1, 2, ':');
  fill(76, 12, 1, 8, '=');               // lane into the east district
  fill(36, 22, 10, 1, 'r');               // railway behind the station

  // ---------------------------------------------------------------- objects
  // interact: name of the activity it triggers. Solid by default.
  const objects = [];
  const obj = (type, x, y, extra = {}) => objects.push(Object.assign({ type, x, y, solid: true }, extra));

  obj('offering', 25, 5, { interact: 'offer', label: 'Offering box' });
  obj('fortune', 19, 5, { interact: 'fortune', label: 'Fortune stand' });
  obj('lantern', 18, 7); obj('lantern', 29, 7);
  obj('torii', 22, 8, { w: 4 }); // pillars at 22 and 25
  obj('fountain', 22, 14, { w: 4, h: 3 });
  obj('sign', 16, 22, { interact: 'sign', text: '↑ Café · Home · Academy   → Shrine (north)   ↓ Sakura Park · Beach' });
  obj('sign', 37, 9, { interact: 'sign', text: 'Shirogane Dojo — "Strength protects what you love."' });
  obj('board', 21, 23, { interact: 'jog', label: 'Running course' });
  for (const [x, y] of [[15, 26], [19, 27], [31, 28]]) obj('bench', x, y, { interact: 'bench', label: 'Bench' });
  for (const [x, y] of [[12, 34], [30, 34]]) obj('umbrella', x, y, { interact: 'sunbathe', label: 'Beach umbrella' });
  obj('sign', 20, 33, { interact: 'swim', label: 'Swim spot', text: 'Swimming area' });
  for (const [x, y] of [[9, 12], [19, 12], [28, 12], [38, 12], [9, 19], [18, 19], [29, 19], [39, 19], [10, 30], [22, 30], [26, 30], [40, 30]]) obj('lamp', x, y);
  for (const [x, y] of [[20, 13], [27, 13], [20, 18], [27, 18]]) obj('flowerbed', x, y);
  obj('mailbox', 8, 17);
  obj('wc', 29, 17, { interact: 'wc', label: 'Public restroom' });
  obj('wc', 46, 34, { interact: 'wc', label: 'Beach restroom' });
  obj('vending', 17, 17, { interact: 'vending', label: 'Vending machine' });
  // east side
  obj('sign', 47, 22, { interact: 'sign', text: '→ Flower Field · Seaside Dorm · Lighthouse Cape' });
  obj('sign', 57, 9, { interact: 'sign', text: '↑ Sakura Onsen · Clock Tower · Forest Lake' });
  obj('windmill', 71, 23);
  obj('gazebo', 59, 28, { w: 2 });
  for (const [x, y] of [[58, 24], [69, 28], [73, 25]]) obj('flowerpatch', x, y, { interact: 'flowerpick', label: 'Wildflowers' });
  obj('lighthouse', 72, 33);
  obj('telescope', 69, 33, { interact: 'lighthouse', label: 'Telescope' });
  for (const [x, y] of [[66, 34], [74, 35], [70, 36]]) obj('rock', x, y);
  obj('bench', 62, 34, { interact: 'bench', label: 'Bench' });
  for (const [x, y] of [[48, 12], [57, 12], [65, 12], [73, 12], [48, 19], [57, 19], [65, 19], [73, 19], [56, 30], [67, 30]]) obj('lamp', x, y);
  obj('mailbox', 56, 28);
  obj('sign', 77, 21, { interact: 'sign', text: '↑ Lucky Seven Casino (from 4pm)   ↓ Tokisaki Mansion (private)' });
  for (const [x, y] of [[79, 12], [86, 12], [79, 19], [86, 19], [79, 30], [86, 30]]) obj('lamp', x, y);

  const trees = [];
  const tree = (x, y, kind = 'oak') => trees.push({ x, y, kind });
  for (let x = 0; x < MW; x += 2) tree(x, 0, x % 4 ? 'pine' : 'oak');
  for (let y = 2; y < 32; y += 2) { tree(0, y, 'pine'); tree(MW - 1, y, 'pine'); }
  // forest around the lake, a few trees around the east side
  [[65, 2], [66, 4], [73, 2], [74, 4], [65, 8], [73, 7], [70, 8], [71, 1], [67, 1], [57, 2], [57, 6], [47, 4], [47, 7]].forEach(([x, y]) => tree(x, y, 'pine'));
  [[56, 23], [74, 29], [47, 13], [47, 16], [55, 29]].forEach(([x, y]) => tree(x, y, 'oak'));
  [[62, 23], [67, 24], [77, 24], [87, 24], [77, 27], [87, 27]].forEach(([x, y]) => tree(x, y, 'sakura'));
  [[83, 2], [80, 5], [86, 6], [78, 8], [88, 3]].forEach(([x, y]) => tree(x, y, 'pine'));
  [[14, 2], [14, 5], [33, 2], [33, 5], [16, 9], [31, 9], [20, 1], [28, 1]].forEach(([x, y]) => tree(x, y, 'pine'));
  [[14, 24], [17, 25], [20, 26], [14, 27], [27, 28], [33, 28], [17, 28], [26, 25], [34, 26], [21, 27]].forEach(([x, y]) => tree(x, y, 'sakura'));
  [[12, 3], [13, 7], [34, 7], [46, 25], [11, 26], [9, 27]].forEach(([x, y]) => tree(x, y, 'oak'));

  // ------------------------------------------------------------- collision
  const solid = [];
  for (let y = 0; y < MH; y++) solid.push(tiles[y].map((t) => t === '~' || t === 'p' || t === 'r'));
  for (let y = 33; y < MH; y++) for (let x = 36; x < 38; x++) solid[y][x] = false; // pier over water
  for (let y = 4; y < 6; y++) solid[y][67] = false; // lake dock
  for (const b of Object.values(B)) for (let j = b.y; j < b.y + b.h; j++) for (let i = b.x; i < b.x + b.w; i++) solid[j][i] = true;
  for (const o of objects) {
    if (o.type === 'torii') { solid[o.y][o.x] = true; solid[o.y][o.x + 3] = true; continue; }
    if (o.type === 'fountain') { for (let j = 0; j < o.h; j++) for (let i = 0; i < o.w; i++) solid[o.y + j][o.x + i] = true; continue; }
    if (o.type === 'umbrella') { solid[o.y][o.x] = true; continue; }
    if (o.type === 'gazebo') { solid[o.y][o.x] = true; solid[o.y][o.x + 1] = true; continue; }

  }
  for (const t of trees) if (solid[t.y]) solid[t.y][t.x] = true;

  function isSolid(tx, ty) {

  // ------------------------------------------------------------------ areas
  const AREAS = {
    park: { name: 'Sakura Park', x: 11, y: 22, w: 25, h: 9, bg: 'park' },

  function areaAt(tx, ty) {

  }
  function randomTileIn(areaId, rnd = Math.random) {

    for (let k = 0; k < 60; k++) {
      const x = a.x + Math.floor(rnd() * a.w), y = a.y + Math.floor(rnd() * a.h);
      if (!isSolid(x, y)) return { x, y };
    }
    return { x: 23, y: a.y + 1 };
  }

  // ---------------------------------------------------------------- A* path
  function findPath(sx, sy, gx, gy) {
    if (sx === gx && sy === gy) return [];
    const key = (x, y) => y * MW + x;
    const open = [[sx, sy]];
    const g = new Map([[key(sx, sy), 0]]);
    const from = new Map();
    const f = new Map([[key(sx, sy), Math.abs(gx - sx) + Math.abs(gy - sy)]]);
    const closed = new Set();
    while (open.length) {
      let bi = 0;
      for (let i = 1; i < open.length; i++) if (f.get(key(...open[i])) < f.get(key(...open[bi]))) bi = i;
      const [cx, cy] = open.splice(bi, 1)[0];
      const ck = key(cx, cy);
      if (cx === gx && cy === gy) {
        const path = [[cx, cy]];

        while (from.has(k)) { k = from.get(k); path.push([k % MW, Math.floor(k / MW)]); }
        path.pop();
        return path.reverse();
      }
      closed.add(ck);
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = cx + dx, ny = cy + dy, nk = key(nx, ny);
        if (closed.has(nk) || (isSolid(nx, ny) && !(nx === gx && ny === gy))) continue;
        const ng = g.get(ck) + 1;
        if (!g.has(nk) || ng < g.get(nk)) {
          g.set(nk, ng);
          f.set(nk, ng + Math.abs(gx - nx) + Math.abs(gy - ny));
          from.set(nk, ck);
          if (!open.some(([ox, oy]) => ox === nx && oy === ny)) open.push([nx, ny]);
        }
      }
    }
    return null;
  }

  // ------------------------------------------------------------- tile art
  const hash = (x, y) => { let h = x * 374761393 + y * 668265263; h = (h ^ (h >> 13)) * 1274126177; return ((h ^ (h >> 16)) >>> 0) / 4294967296; };

  const GROUND = {
    '.': '#86cc6e', ',': '#86cc6e', 'w': '#8ad070', '=': '#d8d0c4', ':': '#dcc398', 'g': '#e4dccc', '_': '#f4dca0', '~': '#3aa0e0', 'p': '#4ab0e0', 'd': '#b88a5a', 'r': '#9a948a',
  };

  function drawTile(b, t, x, y) {
    const ox = x * T, oy = y * T;
    const base = GROUND[t] || GROUND['.'];
    b.rect(ox, oy, T, T, base);
    const r = hash(x, y);
    if (t === 'w') {
      const cols = ['#ffffff', '#f6b8cc', '#ffe066', '#b8c8ff', '#ff8aa8', '#c8a0f0'];
      for (let i = 0; i < 9; i++) {
        const px = ox + Math.floor(hash(x * 7 + i, y) * 15), py = oy + Math.floor(hash(x, y * 5 + i) * 15);
        b.set(px, py + 1, '#5aa04a');
        b.set(px, py, cols[(i + x + y) % cols.length]);
        if (i % 2) b.set(px + 1, py, cols[(i + x * 3) % cols.length]);
      }
    } else if (t === '.' || t === ',') {
      for (let i = 0; i < 5; i++) {
        const px = ox + Math.floor(hash(x + i * 7, y) * 15), py = oy + Math.floor(hash(x, y + i * 11) * 14);
        b.set(px, py, '#6fb85c'); b.set(px + 1, py - 1, '#6fb85c');
      }
      if (r > 0.8) { b.set(ox + 4, oy + 9, '#a8de8a'); b.set(ox + 11, oy + 4, '#a8de8a'); }
      if (t === ',') {
        const fc = ['#ffffff', '#f6b8cc', '#ffe066', '#b8c8ff'][Math.floor(r * 4)];
        [[3, 4], [10, 10], [12, 3], [6, 12]].forEach(([dx, dy], i) => { if (hash(x * 3 + i, y) > 0.35) { b.set(ox + dx, oy + dy, fc); b.set(ox + dx + 1, oy + dy, '#f2d36b'); } });
      }
    } else if (t === '=') {
      b.rect(ox, oy + 7, T, 1, '#c4bab0'); b.rect(ox, oy + 15, T, 1, '#c4bab0');
      const off = y % 2 ? 0 : 8;
      b.rect(ox + off, oy, 1, 7, '#c4bab0'); b.rect(ox + (off + 8) % 16, oy + 8, 1, 7, '#c4bab0');
      if (r > 0.7) b.set(ox + 4, oy + 3, '#e8e2d8');
    } else if (t === ':') {
      for (let i = 0; i < 4; i++) b.set(ox + Math.floor(hash(x, y + i) * 15), oy + Math.floor(hash(x + i, y) * 15), '#c4a878');
    } else if (t === 'g') {
      for (let i = 0; i < 8; i++) b.set(ox + Math.floor(hash(x + i, y * 3) * 16), oy + Math.floor(hash(x * 5, y + i) * 16), i % 2 ? '#cfc6b4' : '#f4efe4');
    } else if (t === '_') {
      for (let i = 0; i < 4; i++) b.set(ox + Math.floor(hash(x + i, y) * 16), oy + Math.floor(hash(x, y + i * 3) * 16), '#e4c888');
      if (r > 0.93) { b.rect(ox + 6, oy + 7, 3, 2, '#f7c8d8'); }
    } else if (t === '~' || t === 'p') {
      b.rect(ox + ((x * 5) % 10), oy + 4, 5, 1, t === '~' ? '#5ab8f0' : '#6ac8f0');
      b.rect(ox + ((x * 3 + 6) % 10), oy + 11, 4, 1, t === '~' ? '#5ab8f0' : '#6ac8f0');
    } else if (t === 'r') {
      for (let i = 0; i < T; i += 4) b.rect(ox + i, oy + 2, 2, 12, '#7a4e30');
      b.rect(ox, oy + 4, T, 2, '#c0c4cc'); b.rect(ox, oy + 10, T, 2, '#c0c4cc'); b.rect(ox, oy + 4, T, 1, '#e8eaf0'); b.rect(ox, oy + 10, T, 1, '#e8eaf0');
    } else if (t === 'd') {
      for (let j = 0; j < T; j += 4) b.rect(ox, oy + j, T, 1, '#8a5a3a');
      b.rect(ox + (x % 2 ? 15 : 0), oy, 1, T, '#6a4028');
    }
  }

  // soft edges where paths, sand and water meet grass
  function drawEdges(b) {
    const isGrass = (t) => t === '.' || t === ',' || t === 'w';
    for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
      const t = tiles[y][x];
      if (isGrass(t)) continue;
      const ox = x * T, oy = y * T;
      const edge = t === '~' ? '#2a80c0' : t === 'p' ? '#3a90c0' : t === '_' ? '#e0c080' : shade(GROUND[t], 0.18);
      if (y > 0 && isGrass(tiles[y - 1][x])) b.rect(ox, oy, T, 1, edge);
      if (y < MH - 1 && isGrass(tiles[y + 1][x])) b.rect(ox, oy + T - 1, T, 1, edge);
      if (x > 0 && isGrass(tiles[y][x - 1])) b.rect(ox, oy, 1, T, edge);
      if (x < MW - 1 && isGrass(tiles[y][x + 1])) b.rect(ox + T - 1, oy, 1, T, edge);
      if (t === '~' && y > 0 && tiles[y - 1][x] === '_') { b.rect(ox, oy, T, 2, '#ffffff'); b.rect(ox + 3, oy + 2, 6, 1, '#d8f0ff'); }
    }
  }

  // ------------------------------------------------------------ buildings
  const STYLES = {
    home: { roof: '#5a7ad8', wall: '#f4e6d0', trim: '#8a5a3a' },
    cafe: { roof: '#8a4a3a', wall: '#f4e0c0', trim: '#5a3a2a', awning: '#4aa070' },
    shop: { roof: '#c84a6a', wall: '#fff0f4', trim: '#8a3a5a', awning: '#f05a8a' },
    arcade: { roof: '#4a3a8a', wall: '#6a5ac8', trim: '#2a2050', awning: '#ff6ad5' },
    school: { roof: '#4a6a8a', wall: '#ece4d4', trim: '#7a6a5a' },
    dojo: { roof: '#5a5a6a', wall: '#8a5a3a', trim: '#4a2e1c' },
    shrine: { roof: '#3a3a4a', wall: '#d8343c', trim: '#f4efe6' },
    apartments: { roof: '#7a7a8a', wall: '#d8d4e4', trim: '#5a5a6a' },
    onsen: { roof: '#4a4a6a', wall: '#e8d8c0', trim: '#7a4e30' },
    clocktower: { roof: '#3e4a6a', wall: '#c8b8a0', trim: '#6a5a4a' },
    maidcafe: { roof: '#f08ab0', wall: '#ffffff', trim: '#5a8ad8', awning: '#5a8ad8' },
    bakery: { roof: '#c8803a', wall: '#fff0d0', trim: '#8a5a3a', awning: '#f2b84a' },
    antiques: { roof: '#3a5a4a', wall: '#b8a888', trim: '#4a3a2a' },
    dorm: { roof: '#5a8ab0', wall: '#f0e8e0', trim: '#6a6a7a' },
    casino: { roof: '#2a1a3a', wall: '#3a2448', trim: '#d6aa44', awning: '#c8203a' },
    mansion: { roof: '#7a1e2e', wall: '#f4efe6', trim: '#d6aa44' },
    station: { roof: '#3a5a8a', wall: '#e4e8ee', trim: '#4a5a6a' },
  };

  function drawBuilding(b, bd) {
    const s = STYLES[bd.style];
    const X = bd.x * T, Y = bd.y * T, Wp = bd.w * T, Hp = bd.h * T;
    const roofH = Math.floor(Hp * (bd.style === 'clocktower' ? 0.22 : bd.style === 'school' || bd.style === 'apartments' || bd.style === 'dorm' ? 0.34 : 0.48));
    const wallY = Y + roofH;
    // walls
    b.rect(X + 2, wallY, Wp - 4, Hp - roofH, s.wall);
    b.rect(X + 2, Y + Hp - 3, Wp - 4, 3, shade(s.wall, 0.25));
    if (bd.style === 'dojo') for (let i = X + 6; i < X + Wp - 4; i += 10) b.rect(i, wallY, 2, Hp - roofH, '#6a4028');
    // roof
    if (bd.style === 'shrine' || bd.style === 'dojo') {
      b.poly([[X - 4, Y + roofH + 2], [X + Wp + 4, Y + roofH + 2], [X + Wp - 6, Y + 4], [X + 6, Y + 4]], s.roof);
      b.rect(X + 4, Y + 2, Wp - 8, 4, shade(s.roof, 0.2));
      b.rect(X - 4, Y + roofH, Wp + 8, 3, shade(s.roof, 0.3));
      if (bd.style === 'shrine') { b.rect(X + Wp / 2 - 6, Y + 8, 12, 8, '#f2d36b'); b.rect(X + Wp / 2 - 4, Y + 10, 8, 4, '#d6aa44'); }
    } else {
      b.rect(X, Y + 2, Wp, roofH, s.roof);
      for (let j = Y + 6; j < Y + roofH; j += 5) b.rect(X, j, Wp, 1, shade(s.roof, 0.2));
      b.rect(X, Y + 2, Wp, 2, tint(s.roof, 0.25));
      b.rect(X - 1, Y + roofH, Wp + 2, 2, shade(s.roof, 0.35));
    }
    if (bd.style === 'home') { b.rect(X + Wp - 20, Y - 4, 8, 12, '#a8724a'); b.rect(X + Wp - 21, Y - 5, 10, 2, '#7a4e30'); }
    if (bd.style === 'clocktower') {
      // pointed spire and a big clock face
      b.poly([[X - 2, Y + roofH + 2], [X + Wp / 2, Y - 14], [X + Wp + 2, Y + roofH + 2]], s.roof);
      b.line(X + Wp / 2, Y - 14, X + Wp / 2, Y - 20, '#d6aa44');
      const cy = Y + roofH + 18;
      b.ellipse(X + Wp / 2, cy, 17, 17, '#d6aa44'); b.ellipse(X + Wp / 2, cy, 15, 15, '#fffaf0');
      for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2; b.set(Math.round(X + Wp / 2 + Math.cos(a) * 12), Math.round(cy + Math.sin(a) * 12), '#3a3a4a'); }
      b.line(X + Wp / 2, cy, X + Wp / 2, cy - 10, '#3a3a4a'); b.line(X + Wp / 2, cy, X + Wp / 2 + 7, cy + 3, '#3a3a4a');
      for (const wy of [cy + 26, cy + 46]) { b.rect(X + Wp / 2 - 4, wy, 8, 10, '#6a5a4a'); b.rect(X + Wp / 2 - 3, wy + 1, 6, 8, '#a8d8f0'); }
    }
    if (bd.style === 'onsen') {
      b.rect(X + Wp - 22, Y - 8, 8, 14, '#8a8a96'); b.rect(X + Wp - 23, Y - 9, 10, 2, '#6a6a76');
      b.ellipse(X + Wp - 18, Y - 14, 5, 3, '#f4f4f8'); b.ellipse(X + Wp - 14, Y - 19, 4, 3, '#e8e8f0');
      b.rect(X + 8, wallY + 2, 18, 10, '#2a3a6a'); b.rect(X + 11, wallY + 4, 12, 6, '#ffffff'); b.rect(X + 14, wallY + 5, 6, 4, '#d8343c');
    }
    if (bd.style === 'casino') {
      // neon marquee, slot-machine sevens, a red carpet to the door
      b.rect(X + 4, wallY + 7, Wp - 8, 9, '#1a1024'); b.rect(X + 5, wallY + 8, Wp - 10, 7, '#ff5aa0');
      for (let i = X + 9; i < X + Wp - 9; i += 8) b.rect(i, wallY + 10, 4, 3, '#ffe066');
      for (let i = X + 2; i < X + Wp - 2; i += 4) b.set(i, Y + 3, i % 8 ? '#ffe066' : '#ff5aa0');
      for (const sx of [X + 8, X + Wp - 20]) { b.rect(sx, wallY + 20, 12, 14, '#d6aa44'); b.rect(sx + 2, wallY + 22, 8, 6, '#ffffff'); b.rect(sx + 3, wallY + 23, 2, 4, '#d8343c'); b.rect(sx + 6, wallY + 23, 2, 4, '#d8343c'); }
    }
    if (bd.style === 'mansion') {
      // white columns, a gold crest and a wrought-iron fence
      for (let i = X + 6; i < X + Wp - 4; i += 18) b.rect(i, wallY, 4, Hp - roofH - 3, '#ffffff');
      b.ellipse(X + Wp / 2, Y + roofH / 2 + 2, 7, 6, '#d6aa44'); b.ellipse(X + Wp / 2, Y + roofH / 2 + 2, 4, 4, '#7a1e2e');
      b.rect(X - 2, Y + Hp - 6, Wp + 4, 1, '#2a2a36'); for (let i = X - 2; i < X + Wp + 2; i += 4) { if (Math.abs(i - (bd.door * T + 8)) < 10) continue; b.rect(i, Y + Hp - 10, 1, 8, '#2a2a36'); b.set(i, Y + Hp - 11, '#d6aa44'); }
    }
    if (bd.style === 'station') {
      // canopy over the entrance, a round clock and a little train at the platform
      b.rect(X + Wp / 2 - 22, wallY + 2, 44, 4, '#5a6a7a'); b.rect(X + Wp / 2 - 22, wallY + 6, 44, 1, '#3a4a5a');
      b.ellipse(X + Wp / 2, Y + roofH / 2 + 2, 7, 7, '#ffffff'); b.ellipse(X + Wp / 2, Y + roofH / 2 + 2, 5, 5, '#f4efe6');
      b.line(X + Wp / 2, Y + roofH / 2 + 2, X + Wp / 2, Y + roofH / 2 - 2, '#3a3a4a'); b.line(X + Wp / 2, Y + roofH / 2 + 2, X + Wp / 2 + 3, Y + roofH / 2 + 3, '#3a3a4a');
      b.rect(X + 6, wallY + 9, 26, 7, '#2a4a8a'); b.rect(X + 8, wallY + 11, 22, 3, '#ffffff');
      const tx = X + Wp - 30, ty = Y - 6;
      b.rect(tx, ty, 34, 14, '#f4f4f8'); b.rect(tx, ty + 9, 34, 3, '#5ab85a'); b.rect(tx + 3, ty + 2, 6, 5, '#a8d8f0'); b.rect(tx + 12, ty + 2, 6, 5, '#a8d8f0'); b.rect(tx + 21, ty + 2, 6, 5, '#a8d8f0');
      b.rect(tx + 30, ty + 2, 4, 7, '#2a2a36');
    }
    if (bd.style === 'maidcafe') { b.ellipse(X + Wp - 12, wallY + 16, 5, 5, '#f08ab0'); b.ellipse(X + Wp - 12, wallY + 16, 2, 2, '#ffffff'); }
    if (bd.style === 'bakery') { b.ellipse(X + 12, wallY + 15, 6, 4, '#e0a050'); b.rect(X + 7, wallY + 14, 10, 2, '#f2d36b'); }
    if (bd.style === 'antiques') { b.rect(X + Wp - 18, wallY + 8, 10, 12, '#d6aa44'); b.ellipse(X + Wp - 13, wallY + 14, 3, 3, '#3a5a4a'); }
    if (bd.style === 'school') { b.ellipse(X + Wp / 2, Y + roofH / 2 + 2, 8, 8, '#ffffff'); b.ellipse(X + Wp / 2, Y + roofH / 2 + 2, 6, 6, '#f4efe6'); b.line(X + Wp / 2, Y + roofH / 2 + 2, X + Wp / 2, Y + roofH / 2 - 3, '#3a3a4a'); b.line(X + Wp / 2, Y + roofH / 2 + 2, X + Wp / 2 + 3, Y + roofH / 2 + 2, '#3a3a4a'); }

    // windows
    const lights = [];
    const winRows = bd.style === 'school' || bd.style === 'apartments' || bd.style === 'dorm' ? 2 : bd.style === 'clocktower' ? 0 : 1;
    const rowH = (Hp - roofH - 6) / winRows;
    for (let r = 0; r < winRows; r++) {
      for (let wx = X + 8; wx < X + Wp - 14; wx += 18) {
        if (r === winRows - 1 && Math.abs(wx + 5 - (bd.door * T + 8)) < 14) continue;
        const wy = Math.floor(wallY + 5 + r * rowH);
        if (bd.style === 'shrine' || bd.style === 'dojo') { b.rect(wx, wy, 10, 9, '#f8f2e0'); b.rect(wx + 5, wy, 1, 9, '#b89a6a'); b.rect(wx, wy + 4, 10, 1, '#b89a6a'); }
        else { b.rect(wx - 1, wy - 1, 12, 11, s.trim); b.rect(wx, wy, 10, 9, '#a8d8f0'); b.rect(wx, wy, 10, 2, '#d8f0ff'); b.rect(wx + 5, wy, 1, 9, s.trim); }
        lights.push({ x: wx, y: wy, w: 10, h: 9 });
      }
    }
    // awning
    if (s.awning) {
      for (let i = 0; i < Wp - 4; i += 6) b.rect(X + 2 + i, wallY, 6, 5, (i / 6) % 2 ? '#ffffff' : s.awning);
      b.rect(X + 2, wallY + 5, Wp - 4, 1, shade(s.awning, 0.3));
    }
    // door
    const dx = bd.door * T + 3, dy = Y + Hp - 15;
    if (bd.style === 'shrine') { b.rect(dx - 2, dy - 2, 14, 15, '#5a2a22'); b.rect(dx, dy, 10, 13, '#7a3a2a'); }
    else if (bd.style === 'onsen') { b.rect(dx - 1, dy - 1, 12, 15, s.trim); b.rect(dx, dy, 10, 13, '#3a2a22'); b.rect(dx - 1, dy - 1, 5, 7, '#d8343c'); b.rect(dx + 6, dy - 1, 5, 7, '#2a4ac8'); }
    else {
      b.rect(dx - 1, dy - 1, 12, 15, s.trim);
      b.rect(dx, dy, 10, 13, bd.style === 'arcade' ? '#1e1832' : '#a8724a');
      if (bd.style !== 'arcade') { b.rect(dx + 1, dy + 1, 8, 4, '#c8945e'); b.set(dx + 8, dy + 7, '#f2d36b'); }
      else b.rect(dx + 2, dy + 2, 6, 9, '#3a2a6a');
    }
    if (bd.style === 'arcade') { b.rect(X + 6, wallY + 7, Wp - 12, 5, '#ff6ad5'); b.rect(X + 10, wallY + 8, Wp - 20, 3, '#6af0ff'); }
    if (bd.style === 'cafe') { b.ellipse(X + Wp - 10, wallY + 14, 5, 5, '#f4efe6'); b.rect(X + Wp - 12, wallY + 12, 4, 4, '#8a5a3a'); }
    if (bd.style === 'shop') { b.ellipse(X + 12, wallY + 16, 4, 4, '#f6b8cc'); b.rect(X + 10, wallY + 19, 4, 3, '#4aa070'); }
    bd.lights = lights;
  }

        b.line(8, 10, 3, 23, '#5a5a6a'); b.line(8, 10, 13, 23, '#5a5a6a'); b.line(8, 10, 8, 23, '#5a5a6a');
        b.poly([[2, 4], [14, 8], [13, 11], [1, 7]], '#d6aa44'); b.rect(1, 4, 2, 4, '#3a3a4a');
        b.outline(0.5); return { b, ox: 0, oy: -8 };
      case 'rock':
        b = new Buf(16, 16);
        b.ellipse(8, 10, 7, 5, '#8a8a96'); b.ellipse(6, 8, 4, 3, '#a8a8b4'); b.set(5, 7, '#c8c8d4');

  function treeSprite(kind) {
    const b = new Buf(32, 44);
    b.rect(13, 30, 6, 12, '#7a4e30'); b.rect(14, 30, 2, 12, '#9a6a44');
    b.ellipse(16, 42, 8, 2, '#5a3a2a');
    if (kind === 'pine') {
      b.poly([[16, 0], [28, 18], [22, 18], [30, 32], [2, 32], [10, 18], [4, 18]], '#3f8048');
      b.poly([[16, 2], [22, 14], [16, 12]], '#5aa060');
      b.poly([[16, 16], [24, 28], [16, 26]], '#5aa060');
    } else {
      const c = kind === 'sakura' ? ['#f6b8cc', '#fbd2df', '#e895b0'] : ['#4f9a5a', '#6cbf6a', '#3f8048'];
      b.ellipse(16, 18, 15, 13, c[0]);
      b.ellipse(10, 14, 7, 6, c[1]);
      b.ellipse(22, 24, 7, 5, c[2]);
      b.ellipse(19, 10, 5, 4, c[1]);
      if (kind === 'sakura') for (let i = 0; i < 8; i++) b.set(4 + (i * 7) % 24, 8 + (i * 5) % 18, '#ffffff');

    return b.toCanvas(1);
  }

  // ---------------------------------------------------------------- render
  let staticCv = null;
  const propCache = new Map();
  const treeCache = {};

  function staticCanvas() {
    if (staticCv) return staticCv;
    const b = new Buf(MW * T, MH * T);
    for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) drawTile(b, tiles[y][x], x, y);
    drawEdges(b);
    const bb = new Buf(MW * T, MH * T);
    for (const bd of Object.values(B)) drawBuilding(bb, bd);
    bb.outline(0.55);
    b.draw(bb);
    staticCv = fastCanvas(b);
    return staticCv;
  }

  // Large buffers: write through ImageData instead of per-pixel fillRect.
  function fastCanvas(b) {
    const cv = document.createElement('canvas');
    cv.width = b.w; cv.height = b.h;
    const ctx = cv.getContext('2d');
    const img = ctx.createImageData(b.w, b.h);
    const memo = new Map();
    for (let i = 0; i < b.d.length; i++) {
      const v = b.d[i];
      if (!v) continue;
      let rgb = memo.get(v);
      if (!rgb) { rgb = PX.hexToRgb(v); memo.set(v, rgb); }
      img.data[i * 4] = rgb[0]; img.data[i * 4 + 1] = rgb[1]; img.data[i * 4 + 2] = rgb[2]; img.data[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    return cv;
  }

  // Tall things that need y-sorting with characters.
  function drawables() {
    const out = [];
    for (const t of trees) {
      if (!treeCache[t.kind]) treeCache[t.kind] = treeSprite(t.kind);
      out.push({ y: t.y * T + 15, img: treeCache[t.kind], x: t.x * T - 8, top: t.y * T - 28 });
    }
    for (const o of objects) {
      if (!propCache.has(o.type)) { const p = propSprite(o); propCache.set(o.type, p && { cv: p.b.toCanvas(1), ox: p.ox, oy: p.oy }); }
      const p = propCache.get(o.type);
      if (!p) continue;
      const footY = o.type === 'fountain' ? (o.y + o.h) * T - 2 : o.type === 'torii' ? o.y * T + 15 : o.y * T + 14;
      out.push({ y: footY, img: p.cv, x: o.x * T + p.ox, top: o.y * T + p.oy });
    }
    return out;
  }

  const LAMPS = objects.filter((o) => o.type === 'lamp' || o.type === 'lantern').map((o) => ({ x: o.x * T + 8, y: o.y * T + (o.type === 'lamp' ? -10 : 0) }));

  function windowLights() {
    staticCanvas();
    const out = [];
    for (const bd of Object.values(B)) for (const l of bd.lights || []) out.push(l);
    return out;
  }

  function minimap(s = 3) {
    const cv = document.createElement('canvas');
    cv.width = MW * s; cv.height = MH * s;
    const ctx = cv.getContext('2d');
    for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
      ctx.fillStyle = GROUND[tiles[y][x]] || GROUND['.'];
      ctx.fillRect(x * s, y * s, s, s);

    for (const t of trees) { ctx.fillStyle = t.kind === 'sakura' ? '#e895b0' : '#3f8048'; ctx.fillRect(t.x * s, t.y * s, s, s); }
    for (const bd of Object.values(B)) { ctx.fillStyle = STYLES[bd.style].roof; ctx.fillRect(bd.x * s, bd.y * s, bd.w * s, bd.h * s); }
    return cv;
  }

  global.WORLD = { T, MW, MH, tiles, B, AREAS, objects, trees, isSolid, findPath, randomTileIn, areaAt, staticCanvas, drawables, LAMPS, windowLights, minimap };
})(window);

  // ---------------------------------------------------------- pathfinding
  function findPathGrid(isSolid, MW, sx, sy, gx, gy) {
    if (sx === gx && sy === gy) return [];
    const key = (x, y) => y * MW + x;
    const open = [[sx, sy]];
    const g = new Map([[key(sx, sy), 0]]);
    const f = new Map([[key(sx, sy), Math.abs(gx - sx) + Math.abs(gy - sy)]]);
    const from = new Map();
    const closed = new Set();
    while (open.length) {
      let bi = 0;
      for (let i = 1; i < open.length; i++) if (f.get(key(...open[i])) < f.get(key(...open[bi]))) bi = i;
      const [cx, cy] = open.splice(bi, 1)[0];
      const ck = key(cx, cy);
      if (cx === gx && cy === gy) {
        const path = [[cx, cy]];
        let k = ck;
        while (from.has(k)) { k = from.get(k); path.push([k % MW, Math.floor(k / MW)]); }
        path.pop();
        return path.reverse();
      }
      closed.add(ck);
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = cx + dx, ny = cy + dy, nk = key(nx, ny);
        if (closed.has(nk) || (isSolid(nx, ny) && !(nx === gx && ny === gy))) continue;
        const ng = g.get(ck) + 1;
        if (!g.has(nk) || ng < g.get(nk)) {
          g.set(nk, ng);
          f.set(nk, ng + Math.abs(gx - nx) + Math.abs(gy - ny));
          from.set(nk, ck);
          if (!open.some(([ox, oy]) => ox === nx && oy === ny)) open.push([nx, ny]);
        }
      }
    }
    return null;
  }

  // ---------------------------------------------------------- floor & wall
  function drawFloor(b, kind, w, h) {
    const W = w * T, H = h * T;
    const fills = {
      wood: ['#c48a5a', '#b07a4c'], planks: ['#9a6a44', '#8a5c3a'], lightwood: ['#c8aa82', '#b89a72'],
      pink: ['#f8e4ea', '#f0d0dc'], arcade: ['#2a2040', '#32284c'], dojo: ['#d8b07a', '#c8a06a'],
      tile: ['#d8ecf0', '#c4dce4'], stone: ['#9a9aa6', '#8a8a96'],
      carpet: ['#7a1e2e', '#8a2a38'], sidewalk: ['#cfcac4', '#b8b2ac'], diner: ['#f4efe4', '#e4d8c4'], marble: ['#f2f0f6', '#e2deea'], train: ['#8a94a8', '#7a8498'],
    };
    const [a, c] = fills[kind];
    b.rect(0, 2 * T, W, H - 2 * T, a);
    if (kind === 'sidewalk') {
      for (let y = 2 * T; y < H; y += 8) b.rect(0, y, W, 1, c);
      for (let y = 2 * T, r = 0; y < H; y += 8, r++) for (let x = (r % 2) * 8; x < W; x += 16) b.rect(x, y, 1, 8, c);
      return;
    }
    if (kind === 'carpet') {
      for (let y = 2 * T; y < H; y += 16) for (let x = 0; x < W; x += 16) { b.rect(x + 7, y + 3, 2, 10, c); b.rect(x + 3, y + 7, 10, 2, c); b.set(x + 8, y + 8, '#d6aa44'); }
      b.rect(0, 2 * T, W, 2, '#d6aa44');
      return;
    }
    if (kind === 'train') { for (let x = 0; x < W; x += 24) b.rect(x, 2 * T, 1, H - 2 * T, c); b.rect(0, H - 6, W, 1, '#c8a030'); return; }
    if (kind === 'pink' || kind === 'arcade' || kind === 'tile' || kind === 'stone' || kind === 'diner' || kind === 'marble') {
      for (let y = 2; y < h; y++) for (let x = 0; x < w; x++) if ((x + y) % 2) b.rect(x * T, y * T, T, T, c);
      if (kind === 'arcade') for (let i = 0; i < 40; i++) b.set((i * 53) % W, 2 * T + ((i * 31) % (H - 2 * T)), ['#ff6ad5', '#6af0ff', '#ffe066'][i % 3]);
    } else {
      for (let y = 2 * T + 7; y < H; y += 8) b.rect(0, y, W, 1, c);
      for (let y = 2 * T, r = 0; y < H; y += 8, r++) for (let x = (r * 19) % 32; x < W; x += 32) b.rect(x, y, 1, 7, c);
    }
  }

  function drawSkyline(b, room) {
    const W = room.w * T;
    b.rect(0, 0, W, 2 * T, '#9ad0f4'); b.rect(0, 0, W, 8, '#7ab8ec'); b.rect(0, 24, W, 8, '#b8e0f8');
    for (let x = 0, i = 0; x < W; i++) {
      const bw = 12 + ((i * 7) % 4) * 6, bh = 10 + ((i * 13) % 5) * 4;
      const col = i % 2 ? '#7a8ab0' : '#8a9ac0';
      b.rect(x, 2 * T - bh, bw, bh, col);
      for (let yy = 2 * T - bh + 3; yy < 2 * T - 3; yy += 4) for (let xx = x + 2; xx < x + bw - 2; xx += 4) if (((xx + yy + i) >> 2) % 3) b.set(xx, yy, '#c8d8f0');
      if (i % 5 === 2) { b.rect(x + bw / 2 - 1, 2 * T - bh - 8, 2, 8, '#6a7aa0'); b.set(x + bw / 2 - 1, 2 * T - bh - 9, '#e05a4a'); }
      x += bw + 1;
    }
  }

  function drawWall(b, room) {
    if (room.skyline) return drawSkyline(b, room);
    const W = room.w * T;
    const [a, c] = room.wall;
    b.rect(0, 0, W, 2 * T, a);
    for (let x = 0; x < W; x += 8) b.rect(x, 0, 1, 2 * T - 4, c);
    b.rect(0, 2 * T - 4, W, 4, shade(a, 0.35));
    b.rect(0, 2 * T - 4, W, 1, tint(a, 0.3));
    for (const d of room.wallDecor) {
      const x = d.x * T;
      switch (d.type) {
        case 'window':
          b.rect(x + 1, 4, 30, 20, '#f4efe6'); b.rect(x + 3, 6, 26, 16, '#9ad0f4'); b.rect(x + 3, 6, 26, 7, '#c4e6fb');
          b.rect(x + 15, 6, 2, 16, '#f4efe6'); b.line(x + 6, 18, x + 11, 9, '#e4f4ff');
          break;
        case 'clock':
          b.ellipse(x + 8, 12, 6, 6, '#f4efe6'); b.ellipse(x + 8, 12, 5, 5, '#ffffff'); b.line(x + 8, 12, x + 8, 8, '#3a3a4a'); b.line(x + 8, 12, x + 11, 12, '#3a3a4a');
          break;
        case 'poster':
          b.rect(x + 2, 4, 26, 20, '#ffffff'); b.rect(x + 4, 6, 22, 16, '#ff9fb8'); b.ellipse(x + 15, 12, 4, 4, '#fff3a0'); b.rect(x + 7, 18, 16, 2, '#ffffff');
          break;
        case 'chalkboard':
          b.rect(x, 3, 32, 22, '#7a5236'); b.rect(x + 2, 5, 28, 18, '#2f3a34');
          b.rect(x + 5, 8, 14, 1, '#f4f4f4'); b.rect(x + 5, 12, 20, 1, '#f4c4d4'); b.rect(x + 5, 16, 16, 1, '#c4e4f4'); b.ellipse(x + 25, 9, 2, 2, '#f4c4d4');
          break;
        case 'board':
          b.rect(x, 4, 32, 20, '#a8724a'); b.rect(x + 2, 6, 28, 16, '#d8b48a');
          b.rect(x + 4, 8, 8, 6, '#ffffff'); b.rect(x + 14, 8, 6, 8, '#fff3a0'); b.rect(x + 22, 9, 6, 6, '#c4e4f4'); b.set(x + 8, 8, '#f05a6a'); b.set(x + 17, 8, '#f05a6a');
          break;
        case 'sale':
          b.rect(x, 5, 32, 14, '#f05a8a'); b.rect(x + 2, 7, 28, 10, '#ffffff'); b.rect(x + 5, 10, 22, 4, '#f05a8a');
          break;
        case 'neon':
          b.rect(x, 6, 48, 2, '#ff6ad5'); b.rect(x, 18, 48, 2, '#ff6ad5'); b.rect(x, 6, 2, 14, '#ff6ad5'); b.rect(x + 46, 6, 2, 14, '#ff6ad5'); b.rect(x + 6, 11, 36, 3, '#6af0ff');
          break;
        case 'neon2':
          b.ellipse(x + 8, 13, 7, 7, '#ffe066'); b.ellipse(x + 8, 13, 5, 5, '#2a2048'); b.rect(x + 7, 8, 2, 10, '#ffe066');
          break;
        case 'shoji':
          b.rect(x, 2, 32, 24, '#7a4e30'); b.rect(x + 2, 4, 28, 20, '#f8f2e0');
          for (let i = x + 2; i < x + 30; i += 7) b.rect(i, 4, 1, 20, '#b89a6a');
          b.rect(x + 2, 13, 28, 1, '#b89a6a');
          break;
        case 'heartsign':
          b.rect(x, 4, 32, 20, '#5a8ad8'); b.rect(x + 2, 6, 28, 16, '#ffffff');
          b.ellipse(x + 12, 12, 3, 3, '#f05a8a'); b.ellipse(x + 17, 12, 3, 3, '#f05a8a'); b.poly([[x + 9, 13], [x + 20, 13], [x + 14.5, 20]], '#f05a8a');
          b.rect(x + 22, 9, 6, 1, '#5a8ad8'); b.rect(x + 22, 13, 5, 1, '#5a8ad8');
          break;
        case 'breadsign':
          b.rect(x, 5, 32, 18, '#8a5a3a'); b.ellipse(x + 16, 14, 11, 6, '#e0a050'); b.line(x + 10, 12, x + 13, 15, '#c07a30'); b.line(x + 16, 11, x + 19, 15, '#c07a30');
          break;
        case 'map':
          b.rect(x, 4, 32, 20, '#e8d4a0'); b.rect(x + 2, 6, 28, 16, '#f4e8c0'); b.poly([[x + 5, 10], [x + 14, 8], [x + 18, 14], [x + 8, 18]], '#8ac07a'); b.ellipse(x + 23, 14, 4, 3, '#7ab0d8'); b.set(x + 12, 12, '#d8343c');
          break;
        case 'clockface':
          b.ellipse(x + 16, 13, 13, 12, '#d6aa44'); b.ellipse(x + 16, 13, 11, 10, '#f8e8c0');
          for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2; b.set(Math.round(x + 16 + Math.cos(a) * 8), Math.round(13 + Math.sin(a) * 8), '#3a3a4a'); }
          b.line(x + 16, 13, x + 16, 6, '#3a3a4a'); b.line(x + 16, 13, x + 21, 15, '#3a3a4a');
          break;
        case 'onsensign':
          b.rect(x, 3, 32, 22, '#2a3a6a'); b.rect(x + 3, 6, 26, 16, '#ffffff');
          b.ellipse(x + 16, 17, 7, 3, '#d8343c'); for (const dx of [-4, 0, 4]) b.line(x + 16 + dx, 14, x + 16 + dx + 1, 8, '#d8343c');
          break;
        case 'painting':
          b.rect(x - 2, 3, 20, 20, '#d6aa44'); b.rect(x, 5, 16, 16, '#2a3a5a'); b.ellipse(x + 11, 10, 3, 3, '#f4e8c0'); b.poly([[x, 21], [x + 6, 13], [x + 10, 17], [x + 16, 11], [x + 16, 21]], '#3a5a4a');
          break;
        case 'menuboard': {
          const w = (d.w || 3) * T;
          b.rect(x, 3, w, 22, '#2a2a32'); b.rect(x + 2, 5, w - 4, 18, d.color || '#d8342c');
          for (let i = 0; i < Math.floor((w - 8) / 14); i++) {
            const ix = x + 6 + i * 14;
            if (d.food === 'chicken') { b.ellipse(ix + 4, 12, 4, 3.5, '#d08a3a'); b.rect(ix + 6, 14, 3, 2, '#f4efe6'); b.set(ix + 2, 10, '#e8a858'); }
            else if (d.food === 'sushi') { b.rect(ix, 12, 9, 4, '#ffffff'); b.rect(ix, 10, 9, 3, '#f08060'); b.rect(ix + 3, 10, 1, 6, '#2a3a2a'); }
            else { b.ellipse(ix + 4, 10, 4, 2, '#e0a050'); b.rect(ix, 11, 9, 2, '#5aa84a'); b.rect(ix, 13, 9, 2, '#7a4a2a'); b.ellipse(ix + 4, 15, 4, 1.5, '#e0a050'); }
            b.rect(ix, 18, 9, 2, '#ffe066');
          }
          break;
        }
        case 'stripes': {
          const w = (d.w || 4) * T;
          for (let xx = x; xx < x + w; xx += 8) b.rect(xx, 0, 4, 2 * T - 4, d.color || '#d8342c');
          break;
        }
        case 'trainwindow':
          b.rect(x + 1, 4, 30, 18, '#c8ccd4'); b.rect(x + 3, 6, 26, 14, '#9ad0f4'); b.rect(x + 1, 0, 2, 4, '#a8acb4'); b.rect(x + 29, 0, 2, 4, '#a8acb4');
          b.ellipse(x + 16, 2, 3, 2, '#e8c040');
          break;
        case 'backsplash': {
          const w = (d.w || 3) * T;
          b.rect(x, 8, w, 24, '#f4f4f0');
          for (let yy = 8; yy < 32; yy += 6) b.rect(x, yy, w, 1, '#d8d8d0');
          for (let yy = 8, r = 0; yy < 32; yy += 6, r++) for (let xx = x + (r % 2) * 4; xx < x + w; xx += 8) b.rect(xx, yy, 1, 6, '#d8d8d0');
          b.rect(x + 2, 6, w - 4, 2, '#8a5a3a');
          for (let i = 0; i < Math.floor(w / 12); i++) b.rect(x + 5 + i * 12, 1, 5, 5, ['#e05a4a', '#f4c84a', '#5aa86a', '#f4f4f0'][i % 4]);
          break;
        }
        case 'scroll':
          b.rect(x - 2, 2, 20, 2, '#5a3a2a'); b.rect(x, 4, 16, 22, '#f8f2e0'); b.rect(x - 2, 26, 20, 2, '#5a3a2a');
          b.rect(x + 6, 7, 4, 3, '#2a2a2a'); b.rect(x + 5, 12, 6, 2, '#2a2a2a'); b.rect(x + 7, 14, 2, 8, '#2a2a2a'); b.ellipse(x + 12, 22, 2, 2, '#d8343c');
          break;
      }
    }
  }

  // ------------------------------------------------- city storefronts
  // Parody shops: McRonald's (burgers), Kentucky Fried Kitsune (chicken),
  // Kura-Kura Sushi (conveyor sushi), the Megamall and the station.
  function storefront(p, w, h) {
    const R = p.style === 'megamall' ? 30 : 20;
    const b = new Buf(w, h + R);
    const dX = (p.door - p.x) * T + 3, dY = h + R - 15;
    const glass = (x, y, gw, gh, frame) => { b.rect(x - 1, y - 1, gw + 2, gh + 2, frame); b.rect(x, y, gw, gh, '#a8d8f0'); b.rect(x, y, gw, 3, '#d8f0ff'); for (let i = x + 10; i < x + gw; i += 12) b.rect(i, y, 1, gh, frame); };
    const door = (frame, fill = '#a8d8f0') => { b.rect(dX - 1, dY - 1, 12, 15, frame); b.rect(dX, dY, 10, 13, fill); b.rect(dX + 4, dY, 1, 13, frame); };
    switch (p.style) {
      case 'mcronalds': {
        const red = '#d8342c', yel = '#ffcc1a', cx = w / 2;
        b.rect(0, 8, w, h + R - 8, red); b.rect(0, 8, w, 3, '#b02a24'); b.rect(0, h + R - 3, w, 3, '#8a1e1a');
        b.ellipse(cx - 6, 14, 6, 10, yel); b.ellipse(cx + 6, 14, 6, 10, yel); b.ellipse(cx - 6, 16, 2.5, 9, red); b.ellipse(cx + 6, 16, 2.5, 9, red);
        b.rect(cx - 13, 14, 26, 14, red); b.rect(cx - 12, 12, 3, 14, yel); b.rect(cx - 1, 12, 2, 14, yel); b.rect(cx + 9, 12, 3, 14, yel);
        b.rect(0, R + 12, w, 2, yel);
        glass(4, R + 18, dX - 8, 22, '#8a1e1a'); glass(dX + 14, R + 18, w - dX - 18, 22, '#8a1e1a');
        door('#8a1e1a');
        break;
      }
      case 'kitsune': {
        b.rect(0, 8, w, h + R - 8, '#ffffff'); b.rect(0, h + R - 3, w, 3, '#c8c0c0');
        for (let x = 0; x < w; x += 8) b.rect(x, 8, 4, 16, '#c8342c');
        b.rect(0, 24, w, 2, '#8a2a24');
        const cx = w / 2;
        b.ellipse(cx, 12, 10, 10, '#c8342c'); b.ellipse(cx, 12, 8, 8, '#ffffff');
        b.poly([[cx - 6, 6], [cx - 2, 10], [cx + 2, 10], [cx + 6, 6], [cx + 5, 14], [cx, 19], [cx - 5, 14]], '#f08a2a');
        b.poly([[cx - 3, 14], [cx + 3, 14], [cx, 19]], '#ffffff'); b.set(cx - 3, 12, '#2a1a10'); b.set(cx + 3, 12, '#2a1a10');
        glass(4, R + 14, dX - 8, 24, '#8a2a24'); glass(dX + 14, R + 14, w - dX - 18, 24, '#8a2a24');
        door('#8a2a24');
        break;
      }
      case 'sushi': {
        b.rect(0, 10, w, h + R - 10, '#a8724a'); b.rect(0, h + R - 3, w, 3, '#6a4028');
        b.poly([[-2, 14], [w + 2, 14], [w - 6, 4], [6, 4]], '#3a3a4a'); for (let x = 6; x < w - 6; x += 4) b.rect(x, 6, 2, 8, '#4a4a5a');
        b.rect(w / 2 - 16, 16, 32, 10, '#f8f2e0'); b.ellipse(w / 2 - 2, 21, 8, 3, '#5a8ad8'); b.poly([[w / 2 + 5, 21], [w / 2 + 11, 17], [w / 2 + 11, 25]], '#5a8ad8'); b.set(w / 2 - 7, 20, '#ffffff');
        for (const lx of [6, w - 10]) { b.ellipse(lx + 2, R + 22, 4, 6, '#e0303a'); b.rect(lx - 1, R + 16, 6, 1, '#2a2a2a'); b.rect(lx - 1, R + 27, 6, 1, '#2a2a2a'); }
        glass(12, R + 16, dX - 16, 18, '#5a3a2a');
        b.rect(dX - 3, dY - 4, 16, 8, '#2a3a6a'); for (let x = dX - 3; x < dX + 13; x += 4) b.rect(x + 3, dY - 4, 1, 8, '#f4f4f4');
        door('#5a3a2a', '#3a2a22');
        break;
      }
      case 'megamall': {
        b.rect(0, 0, w, h + R, '#9ac8e8'); b.rect(0, 0, w, 3, '#6a8ab0');
        for (let y = 6; y < h + R - 20; y += 10) b.rect(0, y, w, 2, '#7aa8d0');
        for (let x = 8; x < w; x += 12) b.rect(x, 3, 1, h + R - 24, '#7aa8d0');
        b.rect(6, 12, w - 12, 12, '#f05a8a'); for (let x = 12; x < w - 12; x += 8) b.rect(x, 15, 5, 6, '#ffffff');
        b.rect(0, h + R - 22, w, 22, '#e8e4ec'); b.rect(0, h + R - 22, w, 2, '#c8c4d0'); b.rect(0, h + R - 3, w, 3, '#b8b4c0');
        for (const bx of [8, w - 20]) { b.rect(bx, h + R - 40, 12, 18, ['#ffe066', '#5ab8f0'][bx === 8 ? 0 : 1]); b.rect(bx + 2, h + R - 36, 8, 2, '#ffffff'); }
        b.rect(dX - 9, dY - 3, 28, 18, '#5a6a8a'); b.rect(dX - 7, dY - 1, 11, 16, '#a8d8f0'); b.rect(dX + 6, dY - 1, 11, 16, '#a8d8f0');
        break;
      }
      case 'fancy': {
        const navy = '#1e2a48', gold = '#d6aa44';
        b.rect(0, 8, w, h + R - 8, navy); b.rect(0, 8, w, 3, gold); b.rect(0, h + R - 3, w, 3, '#141c30');
        b.rect(w / 2 - 22, 13, 44, 9, '#141c30'); b.rect(w / 2 - 20, 15, 40, 5, gold); for (let x = w / 2 - 18; x < w / 2 + 18; x += 5) b.rect(x, 16, 3, 3, '#141c30');
        b.ellipse(w / 2, 11, 3, 3, '#ffe8a0');
        for (const wx of [6, w - 22]) { b.rect(wx - 1, R + 9, 18, 26, gold); b.rect(wx, R + 10, 16, 24, '#ffd890'); b.ellipse(wx + 8, R + 11, 8, 4, '#ffd890'); b.rect(wx + 7, R + 10, 2, 24, gold); b.rect(wx, R + 22, 16, 1, gold); }
        b.rect(dX - 3, R + 6, 16, 5, '#7a1e2e'); for (let x = dX - 3; x < dX + 13; x += 4) b.rect(x, R + 10, 2, 2, '#7a1e2e');
        door(gold, '#5a2a22'); b.set(dX + 8, dY + 7, gold);
        b.rect(dX - 2, h + R - 2, 14, 2, '#c8343c');
        for (const tx of [dX - 9, dX + 15]) { b.ellipse(tx + 2, h + R - 12, 4, 5, '#3f8048'); b.rect(tx, h + R - 7, 5, 5, '#8a8a96'); }
        break;
      }
      case 'station': {
        b.rect(0, 10, w, h + R - 10, '#e4e8ee'); b.rect(0, 6, w, 8, '#3a5a8a'); b.rect(0, 6, w, 2, '#5a7aaa'); b.rect(0, h + R - 3, w, 3, '#a8b0bc');
        b.rect(w / 2 - 30, 18, 60, 10, '#2a4a8a'); b.rect(w / 2 - 26, 21, 22, 4, '#ffffff'); b.rect(w / 2 + 2, 21, 24, 4, '#ffffff');
        b.ellipse(w / 2, R + 10, 6, 6, '#ffffff'); b.line(w / 2, R + 10, w / 2, R + 6, '#3a3a4a'); b.line(w / 2, R + 10, w / 2 + 3, R + 11, '#3a3a4a');
        glass(6, R + 20, 20, 16, '#4a5a6a'); glass(w - 26, R + 20, 20, 16, '#4a5a6a');
        b.rect(dX - 14, dY - 6, 38, 4, '#5a6a7a');
        door('#4a5a6a'); b.rect(dX + 12, dY, 10, 13, '#a8d8f0'); b.rect(dX + 11, dY - 1, 1, 15, '#4a5a6a');
        break;
      }
    }
    b.outline(0.5);
    return { b, ox: 0, oy: -R };
  }

  // ---------------------------------------------------------- prop sprites
  // Each returns { b, ox, oy }: a Buf and its offset from the footprint's
  // top-left pixel (negative oy = the sprite rises above its footprint).
  function propSprite(p, spec = {}) {
    const w = p.w * T, h = p.h * T;
    let b;
    const out = (buf, ox = 0, oy = 0, noOutline) => { if (!noOutline) buf.outline(0.5); return { b: buf, ox, oy }; };
    switch (p.type) {
      case 'bed':
        b = new Buf(w, h + 8);
        b.rect(0, 0, w, 14, '#8a5a3a'); b.rect(2, 2, w - 4, 8, '#a8724a');
        b.rect(1, 12, w - 2, h - 6, '#ffffff'); b.rect(4, 14, w - 8, 8, '#fff3f6');
        { const c = p.color || '#6fa8e8'; b.rect(1, 24, w - 2, h - 18, c); b.rect(1, 24, w - 2, 2, tint(c, 0.3)); b.rect(1, h + 4, w - 2, 2, shade(c, 0.2)); }
        return out(b, 0, -8);
      case 'rug':
        b = new Buf(w, h);
        { const c = p.color || '#7f9ae0'; b.ellipse(w / 2, h / 2, w / 2 - 1, h / 2 - 1, c); b.ellipse(w / 2, h / 2, w / 2 - 6, h / 2 - 6, tint(c, 0.3)); }
        return out(b, 0, 0, true);
      case 'tv':
        b = new Buf(w, h + 14);
        b.rect(2, 0, w - 4, 16, '#2a2a36'); b.rect(4, 2, w - 8, 12, '#5ab8f0'); b.rect(5, 3, 8, 2, '#c4e6fb');
        b.rect(0, 16, w, h - 2, '#7a4e30'); b.rect(1, 17, w - 2, 3, '#9a6a44');
        return out(b, 0, -14);
      case 'desk':
        b = new Buf(w, h + 12);
